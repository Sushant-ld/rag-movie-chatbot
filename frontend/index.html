<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movie RAG Chatbot</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="app">

        <header>

            <h1>🎬 Movie RAG Chatbot</h1>

            <p>
                Ask questions about Hollywood,
                Bollywood and Tollywood movies.
            </p>

        </header>


        <main id="chat">

            <div class="message bot">

                <div class="bubble">

                    Hello! Ask me anything about
                    the movies in my database.

                </div>

            </div>

        </main>


        <div class="input-area">

            <input
                id="question"
                type="text"
                placeholder="Ask about movies..."
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
